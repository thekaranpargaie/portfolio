<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karan Pargaien | Developer Interface</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/terminal.css" />

    <style>
      /* Additional fade-out animation for boot screen */
      .fade-out {
        animation: fadeOut 0.5s ease-out forwards;
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* Boot mode - hide main content */
      #app.boot-mode .sidebar,
      #app.boot-mode .main-content,
      #app.boot-mode .scan-lines {
        display: none;
      }

      /* Normal mode - hide boot screen */
      #app:not(.boot-mode) .boot-screen {
        display: none;
      }

      /* Hover effects */
      .hover-icon:hover {
        color: var(--primary-color) !important;
        text-shadow: 0 0 10px rgba(0, 255, 159, 0.3);
      }

      /* Command input styling */
      #commandInput {
        width: 100%;
        margin-top: 0.75rem;
      }

      /* Scroll into view on new messages */
      .console-line {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="profile-card">
          <h2>Loading...</h2>
          <p>Initializing profile</p>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Terminal Header -->
        <div class="terminal-header">
          <div class="terminal-title">$ TERMINAL.EXE</div>
          <div class="terminal-info">
            Connected • Ready to execute • <span id="timestamp"></span>
          </div>
        </div>

        <!-- Console Output -->
        <div class="console"></div>

        <!-- Command Input -->
        <div style="padding: 1.5rem; border-top: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.3);">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="color: var(--primary-color);">$</span>
            <input
              type="text"
              id="commandInput"
              placeholder="Type 'help' for available commands..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-secondary);">
            💡 Tip: Use ↑↓ arrow keys to navigate command history
          </div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
          <div style="color: var(--text-secondary); font-size: 0.75rem;">
            Loading GitHub stats...
          </div>
        </div>
      </div>
    </div>

    <!-- Scan Lines Effect -->
    <div class="scan-lines"></div>

    <!-- App Script -->
    <script type="module" src="js/app.js"></script>

    <!-- Update timestamp -->
    <script>
      function updateTimestamp() {
        const timestamp = document.querySelector('#timestamp');
        if (timestamp) {
          const now = new Date();
          const time = now.toLocaleTimeString();
          timestamp.textContent = time;
        }
      }

      updateTimestamp();
      setInterval(updateTimestamp, 1000);
    </script>
  </body>
</html>
